<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeroHerb 通路開發 — 名單總覽</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      background: #FBFAF7; color: #3D4A3E;
      font-size: 16px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #A8BCA1; border-radius: 4px; }

    /* RWD visibility */
    @media (max-width: 767px) { .d-only { display: none !important; } }
    @media (min-width: 768px) { .m-only { display: none !important; } }

    /* Animations */
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes slideInUp    { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes fadeIn       { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin         { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Row hover */
    .trow { cursor: pointer; transition: background 120ms; }
    .trow:hover { background: #EEF3EE !important; }

    /* Sidebar nav item hover */
    .nav-btn { transition: background 120ms, color 120ms; }
    .nav-btn:hover { background: rgba(255,255,255,.12) !important; }

    /* Generic button press */
    .pressable { transition: transform 100ms, opacity 130ms; }
    .pressable:active { transform: scale(.97); }

    /* Focus ring */
    button:focus-visible { outline: 2px solid #6B8F71; outline-offset: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ─────────────────────────────────────────────────────────────
// 1. DESIGN TOKENS
// ─────────────────────────────────────────────────────────────
const C = {
  primary:   '#8FAAA4',   /* 莫蘭迪霧青綠 */
  p50:       '#EDF3F2',
  sage:      '#B5CAC5',
  accent:    '#D9B68C',
  accentDk:  '#9E7048',
  danger:    '#C98A6B',
  bg:        '#FBFAF7',
  surface:   '#FFFFFF',
  surf2:     '#F4F1EA',
  text:      '#3D4A3E',
  muted:     '#6E7A6D',
  border:    '#ECE8DF',
  sidebar:   '#3A5C57',   /* 莫蘭迪深青苔 */
};

const STATUS = {
  new:         { bg:'#F0EEE8', fg:'#8A8678',  label:'新名單'  },
  contacted:   { bg:'#E3ECF2', fg:'#5B7C99',  label:'已聯繫'  },
  sampling:    { bg:'#EAE5F0', fg:'#7B6E99',  label:'打樣中'  },
  quoting:     { bg:'#F5EDDD', fg:'#A6824A',  label:'報價中'  },
  negotiating: { bg:'#E6EFE6', fg:'#5E7F64',  label:'議約中'  },
  won:         { bg:'#DCE9DC', fg:'#4A6B50',  label:'成交'    },
  lost:        { bg:'#F3E4DC', fg:'#A66A4F',  label:'流失'    },
};

const STAGE_ORDER = ['new','contacted','sampling','quoting','negotiating','won'];

const CHANNELS = {
  line:  { label:'LINE', bg:'#06C755', abbr:'LN' },
  fb:    { label:'FB',   bg:'#1877F2', abbr:'FB' },
  ig:    { label:'IG',   bg:'#C13584', abbr:'IG' },
  email: { label:'Mail', bg:'#6B8F71', abbr:'EM' },
  phone: { label:'Tel',  bg:'#D9B68C', abbr:'TEL'},
};

const INDUSTRIES = ['養生館','越式洗髮','宮廟','長照','禮儀'];

const NAV_ITEMS = [
  { id:'dashboard', label:'儀表板',  sym:'◈' },
  { id:'brands',    label:'名單總覽', sym:'≡' },
  { id:'pipeline',  label:'商機進度', sym:'↗' },
  { id:'care',      label:'客情維護', sym:'♡' },
  { id:'match',     label:'比對中心', sym:'⟳' },
  { id:'collect',   label:'採集任務', sym:'⚡' },
];

const MOCK_BRANDS = [
  { id:1, name:'6星集足體養生會館', industry:'養生館',  stores:9,  cities:'北/中/南', channels:['line','fb','ig','email'], score:92, status:'quoting',     owner:'江○○',  tax_id:'16830000', est_annual:1800000, probability:60, stage_days:12 },
  { id:2, name:'悅禾莊園SPA',       industry:'養生館',  stores:12, cities:'北/中/南', channels:['line','fb','ig'],          score:89, status:'sampling',    est_annual:2400000, probability:40, stage_days:18 },
  { id:3, name:'小林越式洗髮',       industry:'越式洗髮',stores:5,  cities:'新北',    channels:['fb'],                      score:61, status:'contacted' },
  { id:4, name:'大甲鎮瀾宮',         industry:'宮廟',    stores:1,  cities:'台中',    channels:['fb','line'],               score:95, status:'new',         extra:'主祀:天上聖母' },
  { id:5, name:'青松健康(長照)',      industry:'長照',    stores:23, cities:'中部',    channels:['email','fb'],              score:88, status:'won',         tier:'A', reorder_in_days:6 },
  { id:6, name:'龍巖人本',           industry:'禮儀',    stores:40, cities:'全台',    channels:['email'],                   score:85, status:'lost',        lost_reason:'已有供應商' },
];

// ─────────────────────────────────────────────────────────────
// 2. SVG ICONS
// ─────────────────────────────────────────────────────────────
const P = {
  search:  'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm10 2-4.35-4.35',
  filter:  'M22 3H2l8 9.46V19l4 2v-8.54L22 3z',
  x:       'M18 6 6 18M6 6l12 12',
  chR:     'M9 18l6-6-6-6',
  chD:     'M6 9l6 6 6-6',
  chU:     'M18 15l-6-6-6 6',
  plus:    'M12 5v14M5 12h14',
  clock:   'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
  warn:    'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
  check:   'M20 6 9 17 4 12',
  edit:    'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z',
  phone:   'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z',
  msg:     'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 0 2 2z',
  mail:    'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm18 2-10 7L2 6',
  export:  'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
};

const Icon = ({ n, size = 16, color, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
    stroke={color || 'currentColor'} strokeWidth="1.75"
    strokeLinecap="round" strokeLinejoin="round"
    style={{ flexShrink:0, display:'block', ...style }}
    dangerouslySetInnerHTML={{ __html: P[n] || '' }} />
);

// ─────────────────────────────────────────────────────────────
// 3. PRIMITIVE COMPONENTS
// ─────────────────────────────────────────────────────────────
const ChannelDots = ({ channels }) => (
  <div style={{ display:'flex', gap:4 }}>
    {channels.map(ch => {
      const c = CHANNELS[ch] || { abbr: ch.slice(0,2).toUpperCase(), bg:'#aaa' };
      return (
        <div key={ch} title={c.label || ch} style={{
          width:26, height:26, borderRadius:7, background:c.bg,
          display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
        }}>
          <span style={{ color:'white', fontSize:9, fontWeight:700, letterSpacing:-0.3 }}>{c.abbr}</span>
        </div>
      );
    })}
  </div>
);

const Badge = ({ status, onClick }) => {
  const s = STATUS[status] || STATUS.new;
  return (
    <button onClick={onClick} className="pressable" style={{
      padding:'4px 11px', borderRadius:999, border:'none',
      background:s.bg, color:s.fg, fontSize:12, fontWeight:600,
      cursor: onClick ? 'pointer' : 'default', fontFamily:'inherit',
      display:'inline-flex', alignItems:'center', gap:3, whiteSpace:'nowrap',
    }}>
      {s.label}
      {onClick && <Icon n="chD" size={10} color={s.fg} />}
    </button>
  );
};

const StatusTrail = ({ status, onClick }) => {
  if (status === 'lost') {
    const s = STATUS.lost;
    return (
      <div style={{display:'flex',alignItems:'center',gap:4,cursor:onClick?'pointer':'default'}} onClick={onClick}>
        <span style={{padding:'2px 9px',borderRadius:999,background:s.bg,color:s.fg,fontSize:11,fontWeight:700}}>{s.label}</span>
        {onClick && <Icon n="chD" size={9} color={s.fg} />}
      </div>
    );
  }
  const curIdx = STAGE_ORDER.indexOf(status);
  return (
    <div style={{display:'flex',alignItems:'center',gap:2,cursor:onClick?'pointer':'default',flexWrap:'nowrap'}} onClick={onClick}>
      {STAGE_ORDER.map((s, i) => {
        const cfg    = STATUS[s];
        const isCur  = i === curIdx;
        const isPast = i < curIdx;
        return (
          <React.Fragment key={s}>
            {i > 0 && (
              <div style={{width:5,height:1.5,flexShrink:0,background:isPast?'#C8C5BC':'#E4E1DB'}} />
            )}
            <div style={{
              padding:'3px 9px', borderRadius:999,
              fontSize:12, fontWeight:isCur?700:500,
              whiteSpace:'nowrap', flexShrink:0,
              background: isCur ? cfg.bg : isPast ? '#E8E6E0' : 'transparent',
              color:      isCur ? cfg.fg : isPast ? '#5A5855' : '#9A978F',
              border:`1px solid ${isCur ? cfg.fg+'88' : isPast ? '#B0ADA5' : '#D4D1CB'}`,
              letterSpacing:.1,
              transition:'all 120ms',
            }}>{cfg.label}</div>
          </React.Fragment>
        );
      })}
      {onClick && <Icon n="chD" size={9} color={C.muted} style={{marginLeft:3,flexShrink:0}} />}
    </div>
  );
};

const ScoreBar = ({ score }) => {
  const color = score >= 85 ? C.primary : score >= 70 ? C.accent : C.sage;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:8, minWidth:76 }}>
      <span style={{ fontSize:14, fontWeight:600, fontVariantNumeric:'tabular-nums', color:C.text, minWidth:22 }}>{score}</span>
      <div style={{ flex:1, height:4, background:C.surf2, borderRadius:2, overflow:'hidden' }}>
        <div style={{ height:'100%', width:`${score}%`, background:color, borderRadius:2, transition:'width 500ms' }} />
      </div>
    </div>
  );
};

const StatusPicker = ({ current, onSelect, align = 'left' }) => (
  <div style={{
    position:'absolute', top:'calc(100% + 6px)',
    [align === 'right' ? 'right' : 'left']: 0,
    zIndex:300, background:C.surface, borderRadius:14,
    border:`1px solid ${C.border}`,
    boxShadow:'0 10px 30px rgba(46,69,53,.14)',
    padding:6, minWidth:154,
  }}>
    {Object.entries(STATUS).map(([k, s]) => (
      <button key={k} onClick={() => onSelect(k)} style={{
        display:'flex', alignItems:'center', gap:8, width:'100%',
        padding:'7px 10px', border:'none', borderRadius:9, cursor:'pointer',
        background: k === current ? C.p50 : 'transparent',
        fontFamily:'inherit', fontSize:14, color:C.text,
      }}>
        <span style={{ padding:'2px 9px', borderRadius:999, background:s.bg, color:s.fg, fontSize:11, fontWeight:700 }}>
          {s.label}
        </span>
      </button>
    ))}
  </div>
);

// ─────────────────────────────────────────────────────────────
// 4. DRAWER HELPER COMPONENTS
// ─────────────────────────────────────────────────────────────
const DrawerSection = ({ label, children }) => (
  <div style={{ marginBottom:16 }}>
    <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:1.4, color:C.muted, marginBottom:8 }}>{label}</div>
    <div style={{ background:C.surf2, borderRadius:12, padding:'12px 14px' }}>{children}</div>
  </div>
);

const DrawerRow = ({ label, value, mono }) => (
  <div style={{ display:'flex', gap:8, marginBottom:6, alignItems:'baseline', '&:last-child':{ marginBottom:0 } }}>
    <span style={{ fontSize:12, color:C.muted, minWidth:60, flexShrink:0 }}>{label}</span>
    <span style={{ fontSize:14, color:C.text, fontFamily: mono ? 'monospace' : 'inherit' }}>{value}</span>
  </div>
);

const KPI = ({ label, value, color }) => (
  <div>
    <div style={{ fontSize:11, color:C.muted, marginBottom:3 }}>{label}</div>
    <div style={{ fontSize:20, fontWeight:700, color: color || C.text, fontVariantNumeric:'tabular-nums', lineHeight:1 }}>{value}</div>
  </div>
);

// ─────────────────────────────────────────────────────────────
// 5. SMALL HELPERS
// ─────────────────────────────────────────────────────────────
const StatChip = ({ label, value, color }) => (
  <div style={{ display:'flex', alignItems:'center', gap:6, padding:'6px 12px', borderRadius:10, background:C.surf2 }}>
    <span style={{ fontSize:12, color:C.muted }}>{label}</span>
    <span style={{ fontSize:14, fontWeight:700, color: color || C.text, fontVariantNumeric:'tabular-nums' }}>{value}</span>
  </div>
);

const Empty = () => (
  <div style={{ textAlign:'center', padding:'72px 20px', color:C.muted }}>
    <div style={{ fontSize:40, marginBottom:14 }}>🌿</div>
    <div style={{ fontSize:16, fontWeight:500, color:C.text, marginBottom:6 }}>沒有找到符合條件的品牌</div>
    <div style={{ fontSize:14 }}>試試清除篩選條件</div>
  </div>
);

const Overlay = ({ onClick, blur }) => (
  <div onClick={onClick} style={{
    position:'fixed', inset:0, zIndex:40,
    background:'rgba(46,69,53,.4)',
    backdropFilter: blur ? 'blur(2px)' : 'none',
    animation:'fadeIn 180ms',
  }} />
);

// ─────────────────────────────────────────────────────────────
// 6. NAVIGATION
// ─────────────────────────────────────────────────────────────
const Sidebar = ({ active, onNav }) => (
  <nav style={{
    width:220, flexShrink:0, height:'100vh', position:'sticky', top:0,
    background:C.sidebar, display:'flex', flexDirection:'column', zIndex:10,
  }}>
    {/* Logo */}
    <div style={{ padding:'22px 18px 16px', borderBottom:'1px solid rgba(255,255,255,.07)' }}>
      <img src="assets/wesmile-logo-white.png" alt="WeSmile" style={{ height:26, opacity:.9, display:'block' }}
        onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }} />
      <span style={{ display:'none', fontWeight:800, fontSize:15, color:'white', letterSpacing:.4 }}>WeSmile</span>
      <div style={{ marginTop:5, fontSize:10, color:'rgba(255,255,255,.68)', letterSpacing:1.8, textTransform:'uppercase' }}>
        通路開發系統
      </div>
    </div>

    {/* Nav items */}
    <div style={{ flex:1, padding:'10px 9px', display:'flex', flexDirection:'column', gap:1 }}>
      {NAV_ITEMS.map(item => {
        const isActive = active === item.id;
        return (
          <button key={item.id} onClick={() => onNav(item.id)}
            className="nav-btn"
            style={{
              display:'flex', alignItems:'center', gap:10,
              padding:'10px 13px', borderRadius:10, border:'none', cursor:'pointer', width:'100%',
              background: isActive ? 'rgba(255,255,255,.16)' : 'transparent',
              color: isActive ? 'white' : 'rgba(255,255,255,.82)',
              fontFamily:'inherit', fontSize:14, fontWeight: isActive ? 500 : 400, textAlign:'left',
            }}>
            <span style={{ fontSize:14, lineHeight:1, width:16, textAlign:'center', flexShrink:0 }}>{item.sym}</span>
            {item.label}
          </button>
        );
      })}
    </div>

    {/* User */}
    <div style={{ padding:'12px 14px 22px', borderTop:'1px solid rgba(255,255,255,.07)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
        <div style={{ width:32, height:32, borderRadius:'50%', background:C.primary, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <span style={{ color:'white', fontSize:13, fontWeight:700 }}>W</span>
        </div>
        <div>
          <div style={{ color:'rgba(255,255,255,.88)', fontSize:13, fontWeight:500 }}>Wei</div>
          <div style={{ color:'rgba(255,255,255,.62)', fontSize:11 }}>創辦人</div>
        </div>
      </div>
    </div>
  </nav>
);

const MobileTabBar = () => {
  const tabs = [
    { id:'brands',    label:'名單', sym:'≡' },
    { id:'care',      label:'跟進', sym:'♡' },
    { id:'pipeline',  label:'進度', sym:'↗' },
    { id:'dashboard', label:'我的', sym:'◈' },
  ];
  const [active, setActive] = useState('brands');
  return (
    <div className="m-only" style={{
      position:'fixed', bottom:0, left:0, right:0, zIndex:30,
      background:C.surface, borderTop:`1px solid ${C.border}`,
      display:'flex', paddingBottom:'env(safe-area-inset-bottom)',
    }}>
      {tabs.map(tab => {
        const on = active === tab.id;
        return (
          <button key={tab.id} onClick={() => setActive(tab.id)} style={{
            flex:1, display:'flex', flexDirection:'column', alignItems:'center',
            justifyContent:'center', gap:2, padding:'9px 0',
            border:'none', background:'transparent', cursor:'pointer',
            color: on ? C.primary : C.muted, fontFamily:'inherit',
          }}>
            <span style={{ fontSize:17, lineHeight:1 }}>{tab.sym}</span>
            <span style={{ fontSize:10, fontWeight: on ? 700 : 400 }}>{tab.label}</span>
          </button>
        );
      })}
    </div>
  );
};

// ─────────────────────────────────────────────────────────────
// 7. FILTER BAR
// ─────────────────────────────────────────────────────────────
const FilterBar = ({ filters, onAdd, onRemove, onOpenDrawer }) => {
  const chips = Object.entries(filters).filter(([, v]) => v);
  return (
    <div style={{
      background:C.surface, borderBottom:`1px solid ${C.border}`,
      padding:'10px 20px', display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', flexShrink:0,
    }}>
      <button onClick={onOpenDrawer} style={{
        display:'flex', alignItems:'center', gap:5, padding:'6px 13px',
        border:`1px solid ${C.border}`, borderRadius:999, background:'transparent',
        cursor:'pointer', fontSize:13, color:C.muted, fontFamily:'inherit',
      }}>
        <Icon n="filter" size={13} />篩選
      </button>

      {/* Active filter chips */}
      {chips.map(([key, val]) => {
        const isStatus = key === 'status';
        const s = isStatus ? STATUS[val] : null;
        return (
          <span key={key} style={{
            display:'inline-flex', alignItems:'center', gap:4,
            padding:'5px 8px 5px 13px', borderRadius:999,
            background: s ? s.bg : C.p50,
            color: s ? s.fg : C.primary, fontSize:13, fontWeight:600,
          }}>
            {isStatus ? s?.label : val}
            <button onClick={() => onRemove(key)} style={{
              border:'none', background:'none', cursor:'pointer',
              color:'inherit', padding:0, opacity:.65, lineHeight:1,
              display:'flex', alignItems:'center',
            }}>
              <Icon n="x" size={12} />
            </button>
          </span>
        );
      })}

      {/* Desktop quick status pills */}
      <div className="d-only" style={{ display:'flex', gap:4, marginLeft:4 }}>
        {Object.entries(STATUS).slice(0, 5).map(([k, s]) => (
          <button key={k} onClick={() => onAdd('status', k)} style={{
            padding:'4px 11px', borderRadius:999, fontSize:12, fontWeight:600,
            border:`1px solid ${filters.status === k ? s.fg : C.border}`,
            background: filters.status === k ? s.bg : 'transparent',
            color: filters.status === k ? s.fg : C.muted,
            cursor:'pointer', fontFamily:'inherit', transition:'all 130ms',
          }}>{s.label}</button>
        ))}
      </div>

      {chips.length > 0 && (
        <button onClick={() => chips.forEach(([k]) => onRemove(k))} style={{
          marginLeft:'auto', padding:'4px 10px', borderRadius:999, fontSize:12,
          border:'none', background:'transparent', color:C.muted, cursor:'pointer', fontFamily:'inherit',
        }}>清除全部</button>
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────────────
// 8. BRAND TABLE (desktop)
// ─────────────────────────────────────────────────────────────
const BrandTable = ({ brands, onRowClick, onStatusChange }) => {
  const [sortField, setSortField] = useState(null);
  const [sortDir, setSortDir]     = useState('asc');
  const [picker, setPicker]       = useState(null); // brand id

  const doSort = (f) => {
    if (sortField === f) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortField(f); setSortDir('asc'); }
  };

  const getVal = (item, f) => {
    if (f === 'channels') return (item.channels||[]).length;
    if (f === 'status')   return STAGE_ORDER.indexOf(item.status) >= 0 ? STAGE_ORDER.indexOf(item.status) : 99;
    return item[f];
  };
  const sorted = [...brands].sort((a, b) => {
    if (!sortField) return 0;
    const av = getVal(a, sortField), bv = getVal(b, sortField);
    if (av == null) return 1; if (bv == null) return -1;
    const cmp = typeof av === 'number' ? av - bv : String(av).localeCompare(String(bv), 'zh-TW');
    return sortDir === 'asc' ? cmp : -cmp;
  });

  const TH = ({ f, children, center }) => (
    <th onClick={f ? () => doSort(f) : undefined}
      style={{ padding:'12px 16px', textAlign: center ? 'center' : 'left', cursor: f ? 'pointer' : 'default', userSelect:'none', whiteSpace:'nowrap' }}>
      <div style={{ display:'flex', alignItems:'center', gap:4, justifyContent: center ? 'center' : 'flex-start', color:C.muted, fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:.9 }}>
        {children}
        {f && <Icon n={sortField === f ? (sortDir === 'asc' ? 'chU' : 'chD') : 'chD'}
          size={11} color={sortField === f ? C.primary : C.border} />}
      </div>
    </th>
  );

  return (
    <div style={{ position:'relative', overflowX:'auto' }}>
      {picker && <div style={{ position:'fixed', inset:0, zIndex:200 }} onClick={() => setPicker(null)} />}
      <table style={{ width:'100%', minWidth:960, borderCollapse:'collapse', fontSize:14 }}>
        <thead>
          <tr style={{ background:C.surf2, borderBottom:`1px solid ${C.border}` }}>
            <TH f="name">品牌名稱</TH>
            <TH f="industry">類別</TH>
            <TH f="stores" center>分店</TH>
            <TH f="cities">城市</TH>
            <TH f="channels">管道</TH>
            <TH f="score">評分</TH>
            <TH f="status">狀態</TH>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {sorted.map((b, i) => (
            <tr key={b.id} className="trow" onClick={() => onRowClick(b)}
              style={{ background: i%2===0 ? C.surface : 'rgba(244,241,234,.3)', borderBottom:`1px solid ${C.border}` }}>

              {/* Brand name + meta */}
              <td style={{ padding:'16px 16px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:11 }}>
                  <div style={{ width:38, height:38, borderRadius:11, background:C.p50, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                    <span style={{ fontSize:15, color:C.primary, fontWeight:700 }}>{b.name[0]}</span>
                  </div>
                  <div>
                    <div style={{ fontWeight:500, color:C.text, fontSize:14, lineHeight:1.35 }}>{b.name}</div>
                    {b.owner && <div style={{ fontSize:12, color:C.muted, marginTop:1 }}>{b.owner}</div>}
                    {b.extra  && <div style={{ fontSize:12, color:C.muted, marginTop:1 }}>{b.extra}</div>}
                    {b.reorder_in_days != null && (
                      <div style={{ fontSize:11, color:C.danger, marginTop:2, display:'flex', alignItems:'center', gap:3 }}>
                        <Icon n="clock" size={10} color={C.danger} />補貨剩 {b.reorder_in_days} 天
                      </div>
                    )}
                  </div>
                </div>
              </td>

              <td style={{ padding:'16px', color:C.muted, whiteSpace:'nowrap' }}>{b.industry}</td>

              <td style={{ padding:'16px', textAlign:'center', fontWeight:600, fontVariantNumeric:'tabular-nums', color:C.text }}>{b.stores}</td>

const App = () => {
  const [brands,     setBrands]     = useState(MOCK_BRANDS);

  const [selected,   setSelected]   = useState(null);

  const [search,     setSearch]     = useState('');
  const [aiOpen,     setAiOpen]     = useState(false);
  const [aiText,     setAiText]     = useState('');
  const [aiLoading,  setAiLoading]  = useState(false);

  const exportCSV = () => {
    const hdrs = ['品牌名稱','產業','分店數','城市','評分','狀態','負責人','統編','年預估(NT$)','成交機率(%)'];
    const rows = brands.map(b => [
      b.name, b.industry, b.stores, b.cities, b.score,
      STATUS[b.status]?.label||b.status,
      b.owner||'', b.tax_id||'',
      b.est_annual||'', b.probability||'',
    ]);
    const csv = [hdrs,...rows].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
    a.download = 'HeroHerb_名單總覽.csv';
    a.click();
  };

  const runAI = async () => {
    setAiOpen(true); setAiLoading(true); setAiText('');
    const summary = brands.map(b =>
      `${b.name}（${b.industry}，${b.stores}門市）：狀態=${STATUS[b.status]?.label}，評分=${b.score}，年預估=${b.est_annual||未知}，成交機率=${b.probability||0}%`
    ).join('\n');
    try {
      const res = await window.claude.complete(
        `你是HeroHerb好漢草通路開發顧問。以下是目前的品牌開發名單：\n\n${summary}\n\n請用繁體中文進行以下分析：\n1. 前3大優先跟進品牌（附理由）\n2. 整體管線健康度分析\n3. 下週具體行動建議（3點）\n4. 潛在風險提醒\n\n格式清晰，每段加標題，不超過400字。`
      );
      setAiText(res);
    } catch(e) {
      setAiText('分析失敗，請稍後再試。');
    }
    setAiLoading(false);
  };

  const changeStatus = (id, status) => {
    setBrands(prev => prev.map(b => b.id === id ? { ...b, status } : b));
    setSelected(prev => prev?.id === id ? { ...prev, status } : prev);
  };

  const addFilter    = (k, v) => setFilters(prev => ({ ...prev, [k]: prev[k] === v ? undefined : v }));
  const removeFilter = (k)    => setFilters(prev => { const n = { ...prev }; delete n[k]; return n; });

  const visible = brands.filter(b => {
    if (search && !b.name.includes(search) && !b.industry.includes(search)) return false;
    if (filters.industry && b.industry !== filters.industry) return false;
    if (filters.status   && b.status   !== filters.status)   return false;
    return true;
  });

  const stats = {
    total:  brands.length,
    active: brands.filter(b => !['won','lost'].includes(b.status)).length,
    won:    brands.filter(b => b.status === 'won').length,
    pipe:   Math.round(brands.reduce((s,b) => s + (b.est_annual||0)*(b.probability||0)/100, 0) / 10000),
  };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden', background:C.bg }}>

      {/* Sidebar (desktop only) */}
      <div className="d-only" style={{ display:'flex' }}>
        <Sidebar active={nav} onNav={setNav} />
      </div>

      {/* Main column */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>

        {/* ── Top bar ── */}
        <div style={{ background:C.surface, borderBottom:`1px solid ${C.border}`, padding:'11px 20px', display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>

          {/* Desktop title */}
          <div className="d-only" style={{ display:'flex', alignItems:'baseline', gap:10, flexShrink:0 }}>
            <h1 style={{ fontSize:17, fontWeight:600, color:C.text, margin:0 }}>名單總覽</h1>
            <span style={{ fontSize:13, color:C.muted }}>全部 {brands.length} 筆</span>
          </div>

          {/* Mobile header */}
          <div className="m-only" style={{ display:'flex', alignItems:'center', gap:9 }}>
            <div style={{ width:28, height:28, borderRadius:8, background:C.sidebar, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <span style={{ color:'white', fontSize:11, fontWeight:800 }}>W</span>
            </div>
            <span style={{ fontSize:15, fontWeight:700, color:C.text }}>通路開發</span>
          </div>

          {/* Search */}
          <div style={{ flex:1, maxWidth:320, display:'flex', alignItems:'center', gap:7, background:C.surf2, borderRadius:10, padding:'9px 13px', border:`1px solid ${C.border}` }}>
            <Icon n="search" size={14} color={C.muted} />
            <input value={search} onChange={e => setSearch(e.target.value)}
              placeholder="搜尋品牌或產業…" style={{ flex:1, border:'none', background:'transparent', fontSize:14, color:C.text, outline:'none' }} />
            {search && (
              <button onClick={() => setSearch('')} style={{ border:'none', background:'none', cursor:'pointer', color:C.muted, padding:0, display:'flex' }}>
                <Icon n="x" size={13} />
              </button>
            )}
          </div>

          {/* Desktop stat chips */}
          <div className="d-only" style={{ display:'flex', gap:6, marginLeft:'auto' }}>
            <StatChip label="開發中" value={stats.active} color={C.primary} />
            <StatChip label="已成交" value={stats.won}    color="#4A6B50" />
            <StatChip label="加權商機" value={`NT$${stats.pipe}萬`} color={C.accentDk} />
          </div>

          {/* Mobile filter button */}
          <button className="m-only" onClick={() => setFilterOpen(true)} style={{
            display:'flex', alignItems:'center', gap:5, padding:'9px 13px',
            border:`1px solid ${C.border}`, borderRadius:10, background:'transparent',
            cursor:'pointer', color:C.muted, fontFamily:'inherit', fontSize:14, marginLeft:'auto',
          }}>
            <Icon n="filter" size={15} />篩選
          </button>

          {/* Desktop action buttons */}
          <div className="d-only" style={{display:'flex',gap:7,marginLeft:8}}>
            <button onClick={exportCSV} className="pressable" style={{
              display:'flex',alignItems:'center',gap:5,padding:'9px 13px',
              border:`1px solid ${C.border}`,borderRadius:10,background:C.surface,color:C.muted,
              cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,whiteSpace:'nowrap',
            }}>&#x2193; CSV</button>
            <button onClick={runAI} className="pressable" style={{
              display:'flex',alignItems:'center',gap:5,padding:'9px 13px',
              border:`1px solid ${C.primary}60`,borderRadius:10,background:C.p50,color:C.primary,
              cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,whiteSpace:'nowrap',
            }}>&#x2726; AI 分析</button>
            <button className="pressable" style={{
              display:'flex',alignItems:'center',gap:6,padding:'9px 16px',
              border:'none',borderRadius:10,background:C.primary,color:'white',
              cursor:'pointer',fontFamily:'inherit',fontSize:14,fontWeight:600,whiteSpace:'nowrap',
            }}>
              <Icon n="plus" size={14} color="white" />新增品牌
            </button>
          </div>
        </div>

        {/* ── Filter bar ── */}
        <FilterBar filters={filters} onAdd={addFilter} onRemove={removeFilter} onOpenDrawer={() => setFilterOpen(true)} />

        {/* ── Results summary strip ── */}
        {(Object.keys(filters).some(k => filters[k]) || search) && (
          <div style={{ padding:'8px 20px', background:C.surf2, borderBottom:`1px solid ${C.border}`, fontSize:13, color:C.muted, flexShrink:0 }}>
            找到 <strong style={{ color:C.text }}>{visible.length}</strong> 筆，共 {brands.length} 筆
          </div>
        )}

        {/* ── Content ── */}
        <div style={{ flex:1, overflowY:'auto', paddingBottom:80 }}>

          {/* Desktop table */}
          <div className="d-only">
            {visible.length > 0
              ? <BrandTable brands={visible} onRowClick={setSelected} onStatusChange={changeStatus} />
              : <Empty />}
          </div>

          {/* Mobile card list */}
          <div className="m-only" style={{ padding:'12px 16px' }}>
            {visible.length > 0
              ? visible.map(b => <BrandCard key={b.id} brand={b} onClick={() => setSelected(b)} onStatusChange={changeStatus} />)
              : <Empty />}
          </div>
        </div>
      </div>

      {/* Mobile tab bar */}
      <MobileTabBar />

      {/* Brand detail drawer */}
      {selected && (
        <BrandDrawer brand={selected} onClose={() => setSelected(null)}
          onRecord={() => { const b = selected; setSelected(null); setRecorder(b); }} />
      )}

      {/* AI Analysis Modal */}
      {aiOpen && (
        <div style={{position:'fixed',inset:0,zIndex:600,background:'rgba(21,20,26,.55)',display:'flex',alignItems:'center',justifyContent:'center',padding:20,backdropFilter:'blur(4px)'}}>
          <div style={{background:C.surface,borderRadius:20,width:'100%',maxWidth:560,maxHeight:'82vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 64px rgba(21,20,26,.22)'}}>
            <div style={{padding:'18px 22px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
              <div>
                <div style={{fontSize:16,fontWeight:700,color:C.text}}>&#x2726; AI 開發分析</div>
                <div style={{fontSize:12,color:C.muted,marginTop:2}}>基於目前 {brands.length} 筆品牌資料</div>
              </div>
              <button onClick={()=>setAiOpen(false)} style={{border:'none',background:'none',cursor:'pointer',color:C.muted,fontSize:24,lineHeight:1,padding:4}}>&#x00D7;</button>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'20px 22px'}}>
              {aiLoading ? (
                <div style={{textAlign:'center',padding:'50px 0'}}>
                  <div style={{fontSize:30,marginBottom:14,display:'inline-block',animation:'spin 1.5s linear infinite'}}>&#x2726;</div>
                  <div style={{fontSize:14,color:C.muted}}>Claude 分析中…</div>
                </div>
              ) : (
                <div style={{fontSize:14,color:C.text,lineHeight:1.9,whiteSpace:'pre-wrap'}}>{aiText}</div>
              )}
            </div>
            {!aiLoading && aiText && (
              <div style={{padding:'14px 22px',borderTop:`1px solid ${C.border}`,display:'flex',gap:8,flexShrink:0}}>
                <button onClick={()=>{
                  const w = window.open('','_blank');
                  w.document.write(`<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>AI 開發分析 — HeroHerb</title><style>body{font-family:'Noto Sans TC',sans-serif;padding:48px 56px;max-width:720px;margin:0 auto;color:#3D4A3E;line-height:1.9}h1{color:#3A5C57;margin-bottom:4px}p.sub{color:#6E7A6D;font-size:13px;margin-bottom:28px}pre{white-space:pre-wrap;font-family:inherit;font-size:15px}hr{border:none;border-top:1px solid #ECE8DF;margin:20px 0}@media print{body{padding:24px}}</style></head><body><h1>&#x2726; HeroHerb 通路開發 AI 分析報告</h1><p class="sub">分析時間：${new Date().toLocaleDateString('zh-TW')}</p><hr/><pre>${aiText.replace(/</g,'&lt;')}</pre></body></html>`);
                  w.document.close();
                  setTimeout(()=>w.print(),700);
                }} className="pressable" style={{flex:1,padding:'10px',borderRadius:10,border:'none',background:C.sidebar,color:'white',fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
                  🖴 匯出 PDF
                </button>
                <button onClick={()=>setAiOpen(false)} style={{padding:'10px 18px',borderRadius:10,border:`1px solid ${C.border}`,background:'transparent',color:C.muted,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>關閉</button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* 30-sec quick record */}
      {recorder && <QuickRecord brand={recorder} onClose={() => setRecorder(null)} />}

      {/* Filter drawer */}
      {filterOpen && (
        <FilterDrawer filters={filters} onApply={f => setFilters(f)} onClose={() => setFilterOpen(false)} />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
