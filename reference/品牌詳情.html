<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>品牌詳情 — HeroHerb 通路開發</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;background:#FBFAF7;color:#3D4A3E;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
    button,input,textarea{font-family:inherit}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#B5CAC5;border-radius:4px}
    @media(max-width:767px){.d-only{display:none!important}}
    @media(min-width:768px){.m-only{display:none!important}}
    .nav-a{transition:background 120ms}.nav-a:hover{background:rgba(255,255,255,.12)!important}
    .pressable{transition:transform 100ms}.pressable:active{transform:scale(.97)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = { primary:'#8FAAA4', p50:'#EDF3F2', accent:'#D9B68C', accentDk:'#9E7048', danger:'#C98A6B', bg:'#FBFAF7', surface:'#FFFFFF', surf2:'#F4F1EA', text:'#3D4A3E', muted:'#6E7A6D', border:'#ECE8DF', sidebar:'#3A5C57' };
const STATUS = { new:{bg:'#F0EEE8',fg:'#8A8678',label:'新名單'}, contacted:{bg:'#E3ECF2',fg:'#5B7C99',label:'已聯繫'}, sampling:{bg:'#EAE5F0',fg:'#7B6E99',label:'打樣中'}, quoting:{bg:'#F5EDDD',fg:'#A6824A',label:'報價中'}, negotiating:{bg:'#E6EFE6',fg:'#5E7F64',label:'議約中'}, won:{bg:'#DCE9DC',fg:'#4A6B50',label:'成交'}, lost:{bg:'#F3E4DC',fg:'#A66A4F',label:'流失'} };

const BRAND_DEFAULT = { name:'6星集足體養生會館', industry:'養生館', stores:9, cities:'北/中/南', channels:['line','fb','ig','email'], score:92, status:'quoting', tax_id:'16830000', owner:'江○○', industry_code:'9640', est_annual:1800000, probability:60, stage_days:12, pitch:'連鎖養生館高頻耗材，員工足浴需求穩定，建議先從 3 個主力門市試跑，談定期採購合約。' };
const BRAND = (() => { try { const s=localStorage.getItem('heroherb_selected_brand'); if(!s) return BRAND_DEFAULT; const d=JSON.parse(s); return {...BRAND_DEFAULT,...d,channels:Array.isArray(d.channels)?d.channels:BRAND_DEFAULT.channels}; } catch(e) { return BRAND_DEFAULT; } })();
const CONTACTS_DATA = [
  { id:1, name:'林明美', title:'採購主管', role:'decision_maker', mobile:'0912-345-678', line:'@mingmei', note:'月底開採購會，建議本週寄報價' },
  { id:2, name:'陳志文', title:'大安店長',  role:'gatekeeper',     mobile:'0923-456-789', note:'可請他幫忙引薦總部採購' },
];
const LOGS_DATA = [
  { id:3, date:'6/8',  ch:'visit', summary:'門市拜訪，展示完整產品線，試泡反應正面，要求正式報價單', next:'寄報價單 6/18前' },
  { id:2, date:'6/1',  ch:'phone', summary:'確認樣品已到貨，安排兩週試用期，約定 6/8 門市拜訪' },
  { id:1, date:'5/28', ch:'line',  summary:'初次聯繫，對艾草足浴包有興趣，詢問是否有樣品可試', next:'寄樣品' },
];
const CH_CFG = { line:{label:'LINE',bg:'#06C755'}, fb:{label:'FB',bg:'#1877F2'}, ig:{label:'IG',bg:'#C13584'}, email:{label:'Email',bg:'#8FAAA4'} };
const LOG_EM  = { visit:'📍', phone:'📞', line:'💬', email:'✉️' };
const ROLE_CFG = { decision_maker:{label:'決策者',bg:'#EDF3F2',fg:'#5E8880'}, gatekeeper:{label:'守門人',bg:'#F5EDDD',fg:'#A6824A'} };
const NAV = [{id:'dashboard',label:'儀表板',sym:'◈',href:'儀表板.html'},{id:'brands',label:'名單總覽',sym:'≡',href:'名單總覽.html'},{id:'pipeline',label:'商機進度',sym:'↗',href:'商機看板.html'},{id:'care',label:'今日跟進',sym:'♡',href:'今日跟進.html'},{id:'match',label:'比對中心',sym:'⟳'},{id:'collect',label:'採集任務',sym:'⚡'}];

const P = { x:'M18 6 6 18M6 6l12 12', plus:'M12 5v14M5 12h14', phone:'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z', clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2', chL:'M15 18l-6-6 6-6' };
const Icon = ({n,size=16,color,style}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color||'currentColor'} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,display:'block',...style}} dangerouslySetInnerHTML={{__html:P[n]||''}} />;

const Sidebar = () => (
  <nav style={{width:220,flexShrink:0,height:'100vh',position:'sticky',top:0,background:C.sidebar,display:'flex',flexDirection:'column',zIndex:10}}>
    <div style={{padding:'22px 18px 16px',borderBottom:'1px solid rgba(255,255,255,.07)'}}>
      <img src="assets/wesmile-logo-white.png" alt="WeSmile" style={{height:26,opacity:.9,display:'block'}} onError={e=>{e.target.style.display='none';e.target.nextSibling.style.display='block';}} /><span style={{display:'none',fontWeight:800,fontSize:15,color:'white'}}>WeSmile</span>
      <div style={{marginTop:5,fontSize:10,color:'rgba(255,255,255,.68)',letterSpacing:1.8,textTransform:'uppercase'}}>通路開發系統</div>
    </div>
    <div style={{flex:1,padding:'10px 9px',display:'flex',flexDirection:'column',gap:1}}>
      {NAV.map(item=><a key={item.id} href={item.href||'#'} className="nav-a" style={{display:'flex',alignItems:'center',gap:10,padding:'10px 13px',borderRadius:10,textDecoration:'none',background:item.id==='brands'?'rgba(255,255,255,.16)':'transparent',color:item.id==='brands'?'white':'rgba(255,255,255,.82)',fontSize:14,fontWeight:item.id==='brands'?500:400}}><span style={{fontSize:14,lineHeight:1,width:16,textAlign:'center',flexShrink:0}}>{item.sym}</span>{item.label}</a>)}
    </div>
    <div style={{padding:'12px 14px 22px',borderTop:'1px solid rgba(255,255,255,.07)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:C.primary,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'white',fontSize:13,fontWeight:700}}>W</span></div>
        <div><div style={{color:'rgba(255,255,255,.88)',fontSize:13,fontWeight:500}}>Wei</div><div style={{color:'rgba(255,255,255,.62)',fontSize:11}}>創辦人</div></div>
      </div>
    </div>
  </nav>
);

const Badge = ({status}) => { const s=STATUS[status]||STATUS.new; return <span style={{padding:'4px 11px',borderRadius:999,background:s.bg,color:s.fg,fontSize:12,fontWeight:700,display:'inline-block'}}>{s.label}</span>; };
const Sec = ({title,action,children}) => <div style={{background:C.surface,borderRadius:16,border:`1px solid ${C.border}`,marginBottom:14,overflow:'hidden'}}>{title&&<div style={{padding:'11px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}><span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1.2,color:C.muted}}>{title}</span>{action}</div>}<div style={{padding:'14px 16px'}}>{children}</div></div>;
const IRow = ({label,value,mono}) => <div style={{display:'flex',gap:8,marginBottom:7,alignItems:'baseline'}}><span style={{fontSize:12,color:C.muted,minWidth:68,flexShrink:0}}>{label}</span><span style={{fontSize:14,color:C.text,fontFamily:mono?'monospace':'inherit'}}>{value}</span></div>;

// ── Col 1 ─────────────────────────────────────────────
const Col1 = () => (
  <div>
    <div style={{background:C.sidebar,borderRadius:16,padding:'18px 18px 16px',marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
        <div style={{width:50,height:50,borderRadius:14,background:'rgba(255,255,255,.15)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:20,fontWeight:700,color:'white'}}>{BRAND.name[0]}</span></div>
        <div><div style={{fontWeight:700,fontSize:15,color:'white',lineHeight:1.3}}>{BRAND.name}</div><div style={{fontSize:13,color:'rgba(255,255,255,.6)',marginTop:2}}>{BRAND.industry} · {BRAND.stores}間 · {BRAND.cities}</div></div>
      </div>
      <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
        <Badge status={BRAND.status} />
        <span style={{padding:'4px 11px',borderRadius:999,background:'rgba(255,255,255,.15)',color:'white',fontSize:12,fontWeight:600}}>評分 {BRAND.score}</span>
      </div>
    </div>
    <div className="d-only" style={{display:'flex',gap:8,marginBottom:14}}>
      <a href="tel:+886" className="pressable" style={{flex:1,padding:'11px',borderRadius:12,background:C.surf2,color:C.text,textDecoration:'none',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}><Icon n="phone" size={14} color={C.primary} />撥號</a>
      <a href="https://line.me" target="_blank" rel="noopener" className="pressable" style={{flex:1,padding:'11px',borderRadius:12,background:'#06C75515',color:'#06C755',textDecoration:'none',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>💬 LINE</a>
    </div>
    <Sec title="基本資料">
      <IRow label="統一編號" value={BRAND.tax_id}         mono />
      <IRow label="負責人"   value={BRAND.owner}               />
      <IRow label="行業代號" value={BRAND.industry_code}       />
      <IRow label="分店數"   value={`${BRAND.stores} 間`}     />
      <IRow label="城市"     value={BRAND.cities}              />
    </Sec>
    <Sec title="聯絡管道">
      <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
        {BRAND.channels.map(ch=>{const cfg=CH_CFG[ch]||{label:ch,bg:'#aaa'};return(<div key={ch} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 12px',borderRadius:9,background:C.surf2,border:`1px solid ${C.border}`}}><div style={{width:18,height:18,borderRadius:4,background:cfg.bg,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'white',fontSize:8,fontWeight:700}}>{cfg.label.slice(0,2)}</span></div><span style={{fontSize:13,color:C.text}}>{cfg.label}</span><span style={{fontSize:11,color:C.primary,fontWeight:600}}>已驗證</span></div>);})}
      </div>
    </Sec>
    <Sec title="建議切入點"><p style={{fontSize:13,color:C.muted,lineHeight:1.7,margin:0}}>{BRAND.pitch}</p></Sec>
  </div>
);

// ── Col 2 ─────────────────────────────────────────────
const Col2 = () => (
  <div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1.2,color:C.muted}}>聯絡窗口</span>
      <button style={{display:'flex',alignItems:'center',gap:4,padding:'5px 10px',borderRadius:8,border:`1px solid ${C.border}`,background:'transparent',cursor:'pointer',fontSize:12,color:C.primary,fontFamily:'inherit',fontWeight:600}}><Icon n="plus" size={13} color={C.primary} />新增</button>
    </div>
    {CONTACTS_DATA.map(c=>{
      const role=ROLE_CFG[c.role]||ROLE_CFG.gatekeeper;
      return(
        <div key={c.id} style={{background:C.surface,borderRadius:14,border:`1px solid ${C.border}`,padding:'14px',marginBottom:10}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
            <div style={{display:'flex',alignItems:'center',gap:9}}>
              <div style={{width:38,height:38,borderRadius:10,background:C.p50,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:15,color:C.primary,fontWeight:700}}>{c.name[0]}</span></div>
              <div><div style={{fontWeight:600,fontSize:14,color:C.text}}>{c.name}</div><div style={{fontSize:12,color:C.muted,marginTop:1}}>{c.title}</div></div>
            </div>
            <span style={{padding:'3px 9px',borderRadius:999,background:role.bg,color:role.fg,fontSize:11,fontWeight:700,flexShrink:0,marginLeft:8}}>{role.label}</span>
          </div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:c.note?8:0}}>
            {c.mobile&&<span style={{fontSize:12,color:C.muted}}>📞 {c.mobile}</span>}
            {c.line&&<span style={{fontSize:12,color:'#06C755',fontWeight:500}}>💬 {c.line}</span>}
          </div>
          {c.note&&<div style={{fontSize:12,color:C.muted,background:C.surf2,borderRadius:8,padding:'6px 10px'}}>{c.note}</div>}
        </div>
      );
    })}

    <div style={{marginTop:6}}>
      <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1.2,color:C.muted,display:'block',marginBottom:12}}>商機概況</span>
      <div style={{display:'flex',gap:10,marginBottom:10}}>
        <div style={{flex:1,background:C.surface,borderRadius:12,border:`1px solid ${C.border}`,padding:'12px 14px'}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:3}}>預估年營收</div>
          <div style={{fontSize:18,fontWeight:700,color:C.text,fontVariantNumeric:'tabular-nums'}}>NT$180萬</div>
        </div>
        <div style={{flex:1,background:C.surface,borderRadius:12,border:`1px solid ${C.border}`,padding:'12px 14px'}}>
          <div style={{fontSize:11,color:C.muted,marginBottom:3}}>成交機率</div>
          <div style={{fontSize:18,fontWeight:700,color:C.primary}}>60%</div>
        </div>
      </div>
      {BRAND.stage_days>0&&<div style={{padding:'9px 12px',borderRadius:10,background:`${C.danger}18`,display:'flex',alignItems:'center',gap:7}}>
        <Icon n="clock" size={14} color={C.danger} />
        <span style={{fontSize:12,color:C.danger}}>已在報價中 <strong>{BRAND.stage_days}</strong> 天{BRAND.stage_days>14?' — 建議本週跟進':''}</span>
      </div>}
    </div>
  </div>
);

// ── Col 3: Timeline ───────────────────────────────────
const Col3 = () => {
  const [nextDate,setNextDate] = useState('2026-06-18');
  const [nextNote,setNextNote] = useState('寄正式報價單，附帶採購建議方案');
  const [addOpen,setAddOpen]   = useState(false);
  const [newLog,setNewLog]     = useState('');

  return(
    <div>
      <div style={{background:C.p50,borderRadius:16,border:`1px solid ${C.primary}40`,padding:'14px 16px',marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1.2,color:C.primary,marginBottom:10}}>下次跟進</div>
        <input type="date" value={nextDate} onChange={e=>setNextDate(e.target.value)} style={{width:'100%',padding:'8px 10px',borderRadius:9,border:`1px solid ${C.border}`,background:'white',fontSize:14,color:C.text,marginBottom:8,outline:'none'}} />
        <input value={nextNote} onChange={e=>setNextNote(e.target.value)} placeholder="跟進事項…" style={{width:'100%',padding:'8px 10px',borderRadius:9,border:`1px solid ${C.border}`,background:'white',fontSize:14,color:C.text,outline:'none'}} />
      </div>

      <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:1.2,color:C.muted,marginBottom:12}}>聯繫紀錄</div>

      <div style={{position:'relative'}}>
        <div style={{position:'absolute',left:14,top:0,bottom:0,width:1,background:C.border}} />
        {LOGS_DATA.map(log=>(
          <div key={log.id} style={{display:'flex',gap:14,marginBottom:18,position:'relative'}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:C.surface,border:`2px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,zIndex:1,fontSize:13}}>{LOG_EM[log.ch]||'•'}</div>
            <div style={{flex:1,background:C.surface,borderRadius:12,border:`1px solid ${C.border}`,padding:'10px 14px'}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:4,display:'flex',gap:8,alignItems:'center'}}>
                <strong style={{color:C.text,fontSize:12}}>{log.date}</strong>
                <span style={{padding:'1px 7px',borderRadius:999,background:C.surf2,color:C.muted,fontSize:10}}>{log.ch}</span>
              </div>
              <div style={{fontSize:14,color:C.text,lineHeight:1.55}}>{log.summary}</div>
              {log.next&&<div style={{fontSize:12,color:C.primary,marginTop:6,fontWeight:500}}>→ {log.next}</div>}
            </div>
          </div>
        ))}

        {addOpen?(
          <div style={{display:'flex',gap:14}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:C.p50,border:`2px solid ${C.primary}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,zIndex:1,fontSize:12}}>✏️</div>
            <div style={{flex:1,background:C.surface,borderRadius:12,border:`1px solid ${C.primary}50`,padding:'12px 14px'}}>
              <textarea rows={2} value={newLog} onChange={e=>setNewLog(e.target.value)} placeholder="記錄這次聯繫的重點…" style={{width:'100%',border:'none',background:'transparent',fontSize:14,color:C.text,lineHeight:1.6,resize:'none',outline:'none'}} />
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button onClick={()=>{setAddOpen(false);setNewLog('');}} style={{padding:'7px 14px',borderRadius:9,border:'none',background:C.primary,color:'white',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>儲存</button>
                <button onClick={()=>setAddOpen(false)} style={{padding:'7px 14px',borderRadius:9,border:`1px solid ${C.border}`,background:'transparent',color:C.muted,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>取消</button>
              </div>
            </div>
          </div>
        ):(
          <div style={{display:'flex',gap:14}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:C.surf2,border:`2px dashed ${C.border}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,zIndex:1}}>
              <Icon n="plus" size={13} color={C.muted} />
            </div>
            <button onClick={()=>setAddOpen(true)} style={{flex:1,padding:'9px 14px',borderRadius:12,border:`1px dashed ${C.border}`,background:'transparent',cursor:'pointer',fontSize:14,color:C.muted,fontFamily:'inherit',textAlign:'left'}}>新增聯繫紀錄…</button>
          </div>
        )}
      </div>
    </div>
  );
};

// ── App ───────────────────────────────────────────────
const App = () => {
  const [tab,setTab] = useState('info');
  const tabs = [{id:'info',label:'資料'},{id:'contacts',label:'窗口'},{id:'logs',label:'紀錄'}];
  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <div className="d-only" style={{display:'flex'}}><Sidebar /></div>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>

        {/* Mobile header */}
        <div className="m-only" style={{background:C.sidebar,padding:'14px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <a href="名單總覽.html" style={{color:'rgba(255,255,255,.7)',fontSize:22,textDecoration:'none',lineHeight:1}}>‹</a>
            <div><div style={{fontWeight:600,fontSize:15,color:'white'}}>{BRAND.name}</div><div style={{fontSize:12,color:'rgba(255,255,255,.55)'}}>{BRAND.industry} · {BRAND.stores}間</div></div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <a href="tel:+886" style={{padding:'9px 14px',borderRadius:10,background:'rgba(255,255,255,.15)',color:'white',textDecoration:'none',fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:5}}><Icon n="phone" size={13} color="white" />撥號</a>
            <a href="https://line.me" target="_blank" rel="noopener" style={{padding:'9px 14px',borderRadius:10,background:'#06C755',color:'white',textDecoration:'none',fontSize:13,fontWeight:600}}>LINE</a>
          </div>
        </div>

        {/* Desktop breadcrumb */}
        <div className="d-only" style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:'12px 24px',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
          <a href="名單總覽.html" style={{color:C.muted,textDecoration:'none',fontSize:14,display:'flex',alignItems:'center',gap:4}}><Icon n="chL" size={14} color={C.muted} />名單總覽</a>
          <span style={{color:C.border}}>/</span>
          <span style={{fontSize:14,color:C.text,fontWeight:500}}>{BRAND.name}</span>
          <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
            <button onClick={()=>{
              const hdrs=['姓名','職稱','角色','手機','備註'];
              const rows=CONTACTS_DATA.map(c=>[c.name,c.title,c.role,c.mobile||'',c.note||'']);
              const csv=[hdrs,...rows].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
              const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='HeroHerb_品牌詳情_窗口.csv';a.click();
            }} className="pressable" style={{padding:'6px 12px',borderRadius:8,border:`1px solid ${C.border}`,background:'transparent',color:C.muted,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>&#x2193; CSV</button>
            <Badge status={BRAND.status} />
          </div>
        </div>

        {/* Mobile tabs */}
        <div className="m-only" style={{display:'flex',background:C.surface,borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
          {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'12px 0',border:'none',background:'transparent',cursor:'pointer',fontSize:14,fontWeight:tab===t.id?700:400,color:tab===t.id?C.primary:C.muted,fontFamily:'inherit',borderBottom:`2px solid ${tab===t.id?C.primary:'transparent'}`,transition:'all 150ms'}}>{t.label}</button>)}
        </div>

        {/* Main content */}
        <div style={{flex:1,overflowY:'auto',padding:'20px',paddingBottom:40}}>
          <div className="d-only" style={{display:'flex',gap:20,alignItems:'flex-start',maxWidth:1100}}>
            <div style={{width:260,flexShrink:0}}><Col1 /></div>
            <div style={{width:280,flexShrink:0}}><Col2 /></div>
            <div style={{flex:1,minWidth:0}}><Col3 /></div>
          </div>
          <div className="m-only">
            {tab==='info'&&<Col1 />}
            {tab==='contacts'&&<Col2 />}
            {tab==='logs'&&<Col3 />}
          </div>
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
